version: 2
updates:
  # Action bumps are CI-only and never touch the shipped provider binary, so
  # they use the `ci` type and do not need a CHANGELOG entry.
  # `include: scope` yields `ci(deps): ...`.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      gha:
        patterns: ["*"]

  # Go module bumps change the SHIPPED provider binary, so they land as
  # `fix(deps): ...`, which marks them for the next patch release and its
  # CHANGELOG entry. Dependabot's default `chore(deps):` would hide that.
  # See RELEASE.md.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]

  # /tools is dev tooling (lint, docs generation) — never shipped, so
  # `chore(deps):`.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tools:
        patterns: ["*"]

  # Integration-test fixtures only — never shipped.
  - package-ecosystem: "terraform"
    directory: "/integration"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      integration:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/integration"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
